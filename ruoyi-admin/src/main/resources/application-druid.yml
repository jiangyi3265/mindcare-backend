# 数据源配置。密码等敏感值必须由环境变量提供。
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: ${DB_URL:jdbc:mysql://localhost:3306/mindcare?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD}
      slave:
        enabled: false
        url: ${SLAVE_DB_URL:}
        username: ${SLAVE_DB_USERNAME:}
        password: ${SLAVE_DB_PASSWORD:}
      initialSize: 5
      minIdle: 10
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: ${DRUID_CONSOLE_ENABLED:false}
        allow:
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:}
        login-password: ${DRUID_PASSWORD:}
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
